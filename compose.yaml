name: sentinel

services:
  proxy:
    image: nginx:1.30.3-alpine@sha256:0d3b80406a13a767339fbe2f41406d6c7da727ab89cf8fae399e81f780f814d1
    container_name: sentinel-proxy
    restart: unless-stopped
    network_mode: host
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx:uid=0,gid=0,mode=1777
      - /var/run:uid=0,gid=0,mode=0755
      - /tmp:uid=101,gid=101,mode=0750
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/cloudflare-realip.conf:/etc/nginx/cloudflare-realip.conf:ro
      - ./nginx/generated:/etc/nginx/conf.d:ro
      - ${TLS_MOUNT_ROOT:?TLS_MOUNT_ROOT is required}:/etc/sentinel/tls:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate --header=\"Host: `cat /etc/nginx/conf.d/.healthcheck-host`\" -qO- https://127.0.0.1/.sentinel/health | grep -qx ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
