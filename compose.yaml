name: sentinel

services:
  proxy:
    image: nginx:1.30.6-alpine@sha256:901e593c95dc85f5a729f5765516321366ef4ac401821431d408897e95287d0a
    container_name: sentinel-proxy
    restart: unless-stopped
    mem_limit: ${SENTINEL_MEMORY_LIMIT:-512m}
    network_mode: host
    labels:
      io.sentinel.recovery: running-only
    entrypoint: ["/usr/local/bin/sentinel-entrypoint"]
    command: ["nginx", "-g", "daemon off;"]
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx:size=${SENTINEL_CACHE_SIZE:-128m},uid=0,gid=0,mode=1777
      - /var/run:size=4m,uid=0,gid=0,mode=0755
      - /tmp:size=16m,uid=101,gid=101,mode=0750
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/generated:/etc/nginx/conf.d:ro
      - /usr/local/libexec/sentinel/container-startup-check.sh:/usr/local/bin/sentinel-entrypoint:ro
      - ${TLS_MOUNT_ROOT:?TLS_MOUNT_ROOT is required}:/etc/sentinel/tls:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$$(cat /etc/nginx/conf.d/current/.healthcheck-port)/.sentinel/health | grep -qx ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
